<!DOCTYPE html>
<html lang="uz"><head><meta name="robots" content="noindex"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RABOSA concept — Keramik plita katalogi</title>
<meta name="theme-color" content="#18181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RABOSA">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="icon" href="icon192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#18181a;--soft:#82817d;--line:#e4e2de;--gold:#be9e70;--panel:#f7f6f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--ink:#ecebe7;--soft:#9b9994;--line:#2e2d2a;--panel:#1d1d1b}}
:root[data-theme="dark"]{--bg:#141413;--ink:#ecebe7;--soft:#9b9994;--line:#2e2d2a;--panel:#1d1d1b}
.thm{width:40px;height:40px;border:1px solid var(--line);background:transparent;
     color:var(--ink);font-size:16px;line-height:1;transition:all .22s;flex:none}
.thm:hover{border-color:var(--ink)}
html{transition:none}
body,.bar,.card img,.chip,#q{transition:background-color .35s,color .35s,border-color .35s}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,Arial,sans-serif;
     line-height:1.5;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;color:inherit}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}

/* ── muqova: parallaks ── */
.hero{position:relative;height:96vh;min-height:520px;overflow:hidden;background:#111}
.hero .bgwrap{position:absolute;inset:-8% 0;height:116%;will-change:transform}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
          opacity:0;transform:scale(1.04);transition:opacity 1.8s ease}
.hero .bg.on{opacity:.9;animation:kb 13s ease-out forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.13)}}
.dots{position:absolute;right:24px;bottom:26px;display:flex;gap:7px;z-index:3}
.dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);
        cursor:pointer;transition:all .3s}
.dots b.on{background:#fff;width:20px;border-radius:4px}
.hero .veil{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(10,10,12,.42) 0%,rgba(10,10,12,0) 28%,
             rgba(10,10,12,.30) 52%,rgba(10,10,12,.78) 78%,rgba(10,10,12,.92) 100%)}
.hero .in{position:absolute;inset:auto 0 0 0;padding:0 24px 54px;max-width:1240px;
          margin:0 auto;width:100%}
.hero .lg{width:clamp(260px,32vw,440px);filter:brightness(0) invert(1);
          opacity:0;transform:translateY(20px)}
.hero .sub{margin:26px 0 0;color:#d9d6d0;font-size:15px;letter-spacing:.06em;
           opacity:0;transform:translateY(20px)}
.hero .rule{height:1px;background:var(--gold);margin-top:22px;transform:scaleX(0);
            transform-origin:left}
.go{position:absolute;left:50%;bottom:22px;color:#fff;opacity:.75;font-size:22px;
    animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,9px)}}
.hero.on .lg,.hero.on .sub{opacity:1;transform:none;
  transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.hero.on .sub{transition-delay:.18s}
.hero.on .rule{transform:scaleX(1);transition:transform 1.1s cubic-bezier(.2,.7,.2,1) .3s}

/* ── boshqaruv ── */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
     backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:11px 24px;
     transition:box-shadow .3s}
.bar.stuck{box-shadow:0 6px 24px rgba(0,0,0,.07)}
.bar .in{max-width:1240px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:180px;padding:12px 14px;font:inherit;border:1px solid var(--line);
   background:var(--panel);color:var(--ink);transition:border-color .2s}
#q:focus{outline:none;border-color:var(--ink)}
.chip{padding:10px 15px;border:1px solid var(--line);background:transparent;color:var(--ink);
      font-size:14px;font-weight:500;transition:all .22s cubic-bezier(.2,.7,.2,1)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.cnt{color:var(--soft);font-size:14px}

/* ── setka ── */
.wrap{max-width:1240px;margin:0 auto;padding:34px 24px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:26px 18px;
      align-items:end}
.card{background:none;border:0;padding:0;text-align:left;color:var(--ink);
      opacity:0;transform:translateY(22px)}
.card.in{opacity:1;transform:none;
         transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.card .ph{display:flex;align-items:flex-end;justify-content:center;height:236px;
          transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.card img{border:1px solid var(--line);max-height:236px;width:auto;
          transition:box-shadow .4s,border-color .3s}
.card:hover .ph{transform:translateY(-9px)}
.card:hover img{box-shadow:0 18px 34px rgba(0,0,0,.18);border-color:var(--gold)}
.card b{display:block;font-size:13px;font-weight:600;margin-top:11px;
        word-break:break-all;color:var(--ink)}
.card span{display:block;font-size:12px;color:var(--soft)}

/* ── mahsulot ── */
.detail{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
        transform:translateY(24px);opacity:0;pointer-events:none;
        transition:opacity .38s ease,transform .38s cubic-bezier(.2,.7,.2,1)}
.detail.on{opacity:1;transform:none;pointer-events:auto}
.dwrap{max-width:1240px;margin:0 auto;padding:22px 24px 80px}
.back{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:11px 18px;
      font-weight:600;margin-bottom:20px;transition:all .2s}
.back:hover{background:var(--ink);color:var(--bg)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
       border-bottom:1.5px solid var(--ink);padding-bottom:10px;flex-wrap:wrap}
.dhead h2{margin:0;font-size:clamp(30px,5.4vw,58px);line-height:1}
.dhead .sz{font-size:17px;font-weight:600}
.dmain{display:grid;grid-template-columns:1.7fr 1fr;gap:26px;margin-top:22px}
@media(max-width:760px){.dmain{grid-template-columns:1fr}}
.dmain img{border:1px solid var(--line);width:100%}
.rise{opacity:0;transform:translateY(18px)}
.detail.on .rise{opacity:1;transform:none;
  transition:opacity .5s ease .1s,transform .5s cubic-bezier(.2,.7,.2,1) .1s}
.detail.on .rise:nth-child(2){transition-delay:.18s}
dl{margin:18px 0 0}
dl div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
       border-bottom:1px solid var(--line)}
dt{color:var(--soft);font-size:14px}
dd{margin:0;font-weight:600;font-size:14.5px;text-align:right}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:24px}
.thumbs img{border:1px solid var(--line);cursor:zoom-in;transition:transform .35s,box-shadow .35s}
.thumbs img:hover{transform:scale(1.03);box-shadow:0 12px 26px rgba(0,0,0,.16)}
.lbl{font-size:12px;font-weight:600;color:var(--soft);letter-spacing:.14em;
     border-top:1.5px solid var(--ink);padding-top:12px;margin-top:30px}

/* ── kattalashtirish ── */
#lb{position:fixed;inset:0;background:rgba(12,12,14,0);z-index:60;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    transition:background .3s}
#lb.on{display:flex}#lb.vis{background:rgba(12,12,14,.97)}
#lb img{max-width:94vw;max-height:84vh;object-fit:contain;opacity:0;transform:scale(.94);
        transition:opacity .34s ease,transform .34s cubic-bezier(.2,.7,.2,1);cursor:zoom-in}
#lb.vis img{opacity:1;transform:none}
#lb img.zoom{cursor:zoom-out;transform:scale(1.85)}
#lb .nav{position:absolute;top:50%;margin-top:-32px;font-size:34px;color:#fff;background:none;
         border:0;padding:16px 22px;opacity:.7;transition:opacity .2s}
#lb .nav:hover{opacity:1}
#lb .pv{left:2px}#lb .nx{right:2px}
#lb .x{position:absolute;top:10px;right:16px;font-size:34px;color:#fff;background:none;border:0}
#lb .cnt2{color:#bdbab5;font-size:13px;margin-top:14px}
/* ── tanlash ── */
.star{position:absolute;top:6px;right:6px;z-index:3;width:30px;height:30px;border:0;
      background:rgba(255,255,255,.88);color:#b9b6b0;font-size:16px;line-height:1;
      opacity:0;transform:scale(.85);transition:all .2s;border-radius:50%}
.card{position:relative}
.card:hover .star,.star.on{opacity:1;transform:none}
.star.on{color:var(--gold);background:rgba(255,255,255,.96)}
@media(hover:none){.star{opacity:1;transform:none}}
.fab{position:fixed;right:20px;bottom:20px;z-index:45;background:var(--ink);color:var(--bg);
     border:0;padding:14px 20px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.24);
     transform:translateY(90px);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.fab.on{transform:none}
.panel{position:fixed;inset:0;z-index:55;background:rgba(12,12,14,.5);display:none}
.panel.on{display:block}
.panel .in{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);
  padding:22px;overflow-y:auto;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.7,.2,1)}
.panel.vis .in{transform:none}
.panel h3{margin:0 0 4px;font-size:24px}
.pclose{position:absolute;top:14px;right:16px;background:none;border:0;color:var(--soft);
  font-size:30px;line-height:1;padding:4px 8px;transition:color .2s}
.pclose:hover{color:var(--ink)}
.sel{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.sel img{width:48px;height:96px;object-fit:cover;border:1px solid var(--line);flex:none}
.sel .info{flex:1;min-width:0}
.sel b{font-size:13.5px;display:block;word-break:break-all}
.sel .m{font-size:12px;color:var(--soft);line-height:1.6}
.sel .qty{display:flex;gap:6px;align-items:center;margin-top:7px}
.sel .qty input{width:74px;padding:6px 8px;font:inherit;font-size:12.5px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sel .qty .o{font-size:12px;color:var(--gold);font-weight:600}
.sel .del{background:none;border:0;color:var(--soft);font-size:19px;align-self:flex-start}
.tot{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--ink);font-size:13.5px}
.prow{display:flex;gap:8px;margin-top:18px}
.prow button{flex:1;padding:12px;border:1px solid var(--ink);background:var(--ink);
  color:var(--bg);font-weight:600}
.prow button.alt{background:transparent;color:var(--ink)}
#out{width:100%;margin-top:14px;min-height:130px;padding:10px;font-family:ui-monospace,monospace;
     font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:none}

/* ── hisoblagich ── */
.calc{margin-top:28px;border:1px solid var(--line);padding:20px}
.calc h4{margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--soft)}
.calc .dims{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.calc label{display:block;font-size:11.5px;color:var(--soft);margin-bottom:4px}
.calc input{width:92px;padding:9px 10px;font:inherit;border:1px solid var(--line);
  background:var(--bg);color:var(--ink)}
.calc input:focus{outline:none;border-color:var(--ink)}
.calc .opts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:14px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.calc .opts label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px;
  margin:0;cursor:pointer}
.calc table{width:100%;border-collapse:collapse;font-size:13px}
.calc td{padding:8px 0;border-bottom:1px solid var(--line)}
.calc td.n{text-align:right;font-variant-numeric:tabular-nums}
.calc td.p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.calc tr.tot td{border-bottom:0;border-top:1.5px solid var(--ink);font-weight:600;
  padding-top:11px;font-size:14px}
.calc .note{font-size:11.5px;color:var(--soft);margin-top:10px;line-height:1.6}
.calc .add{margin-top:14px;padding:11px 18px;border:1px solid var(--ink);background:var(--ink);
  color:var(--bg);font-weight:600}
.calc .add.done{background:var(--gold);border-color:var(--gold)}

.inst{position:fixed;left:14px;right:14px;bottom:14px;z-index:50;background:var(--ink);
  color:var(--bg);padding:14px 16px;display:none;align-items:center;gap:12px;
  box-shadow:0 14px 34px rgba(0,0,0,.3);transform:translateY(120%);
  transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.inst.on{display:flex}.inst.vis{transform:none}
.inst .t{flex:1;font-size:13.5px;line-height:1.5}
.inst b{font-weight:600}
.inst button{background:var(--bg);color:var(--ink);border:0;padding:9px 14px;font-weight:600;
  font-size:13px;white-space:nowrap}
.inst .cl{background:none;color:var(--bg);opacity:.7;padding:6px 4px;font-size:20px}
@media(min-width:820px){.inst{left:auto;right:20px;width:400px;bottom:80px}}

.foot{border-top:1px solid var(--line);padding:26px 24px;color:var(--soft);font-size:13px}
.foot .in{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Ariza (lead) ===== */
.lbar{position:fixed;left:20px;bottom:20px;z-index:46;display:flex}
.lbtn{background:var(--gold);color:#18181a;border:0;padding:14px 22px;font:inherit;font-weight:700;
  font-size:14.5px;box-shadow:0 12px 30px rgba(0,0,0,.22);cursor:pointer;display:flex;
  align-items:center;gap:10px;transition:transform .2s,filter .2s}
.lbtn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.lbtn .ar,.lq .ar{font-size:18px;line-height:1}
@media(max-width:699px){
  .lbar{left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .lbtn{flex:1;justify-content:center;padding:15px 18px;font-size:15.5px;box-shadow:none}
  .fab{bottom:84px;right:14px}
  .inst{bottom:84px}
  body{padding-bottom:78px}
  .dwrap{padding-bottom:96px}
}
.lq{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;
  padding:15px 18px;background:var(--gold);color:#18181a;border:0;font:inherit;font-weight:700;
  font-size:15px;cursor:pointer}
.lpq{display:block;width:100%;margin-top:16px;padding:14px;background:var(--gold);color:#18181a;
  border:0;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
.lead{position:fixed;inset:0;z-index:58;background:rgba(12,12,14,.55);display:none;
  align-items:flex-end;justify-content:center}
.lead.on{display:flex}
.lead .lw{background:var(--bg);color:var(--ink);width:min(520px,100%);max-height:100%;
  overflow-y:auto;box-sizing:border-box;padding:26px 22px calc(22px + env(safe-area-inset-bottom));
  position:relative;transform:translateY(40px);opacity:0;
  transition:transform .32s cubic-bezier(.2,.7,.2,1),opacity .25s}
.lead.vis .lw{transform:none;opacity:1}
@media(min-width:700px){.lead{align-items:center}.lead .lw{max-height:92vh;padding:30px 30px 26px}}
.lead h3{margin:0;font-size:30px;line-height:1.1;padding-right:30px}
.lead .ls{margin:8px 0 18px;color:var(--soft);font-size:13.5px;line-height:1.55}
.lead .lx{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--soft);
  font-size:30px;line-height:1;padding:6px 10px;cursor:pointer}
.lsel{border:1px solid var(--line);background:var(--panel);padding:12px 14px;margin-bottom:18px;
  font-size:13px}
.lsel .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-bottom:6px;font-weight:600}
.lsel .h a{color:var(--gold);font-weight:600;font-size:12.5px;cursor:pointer;
  text-decoration:underline;white-space:nowrap}
.lsel ul{margin:0;padding:0;list-style:none}
.lsel li{display:flex;gap:10px;align-items:center;padding:4px 0}
.lsel li img{width:20px;height:40px;object-fit:cover;border:1px solid var(--line);flex:none}
.lsel li span{color:var(--soft)}
.lsel .e{color:var(--soft);line-height:1.5}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.lf label i{font-style:normal;color:var(--soft);font-weight:400}
.lf input,.lf select{width:100%;box-sizing:border-box;padding:13px 12px;font:inherit;
  font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:0;-webkit-appearance:none;appearance:none}
.lf select{background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
  linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;
  background-repeat:no-repeat;padding-right:34px}
.lf input:focus,.lf select:focus{outline:none;border-color:var(--ink)}
.lf.err input,.lf.err select,.lf.err .tel{border-color:#c0392b}
.lf .em{display:none;color:#c0392b;font-size:12px;margin-top:5px}
.lf.err .em{display:block}
.tel{display:flex;border:1px solid var(--line)}
.tel span{padding:13px 10px 13px 12px;font-size:16px;color:var(--soft);background:var(--panel);
  border-right:1px solid var(--line)}
.tel input{border:0!important;flex:1;min-width:0}
.tel:focus-within{border-color:var(--ink)}
.lch{display:flex;flex-wrap:wrap;gap:7px}
.lch button{padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  font:inherit;font-size:13px;cursor:pointer}
.lch button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lhp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.lgo{width:100%;margin-top:6px;padding:16px;background:var(--gold);color:#18181a;border:0;
  font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.lgo:disabled{opacity:.6;cursor:wait}
.lcon{font-size:11.5px;color:var(--soft);line-height:1.55;margin:10px 0 0;text-align:center}
.lerr{display:none;margin-top:10px;padding:10px 12px;border:1px solid #c0392b;color:#c0392b;
  font-size:13px;line-height:1.5}
.lok{text-align:center;padding:18px 0 4px}
.lok .ic{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#18181a;
  font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.lok h3{margin-bottom:8px;padding:0}
.lok p{color:var(--soft);font-size:14px;line-height:1.6;margin:0 0 20px}
.lok p b{color:var(--ink)}
.lok .lback{padding:13px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  font:inherit;font-weight:600;cursor:pointer}
.ltest{margin-top:20px;text-align:left;border:1px dashed var(--gold);padding:12px 14px;
  font-size:12.5px;line-height:1.5;color:var(--soft)}
.ltest b{display:block;margin-bottom:4px;color:var(--gold);letter-spacing:.08em;font-size:11.5px}
.ltest pre{margin:8px 0 0;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;
  font-size:12px;line-height:1.55;color:var(--ink)}
/* qo'ng'iroq */
.lbar{gap:10px}
.lcall{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 18px;
  background:var(--bg);color:var(--ink);border:1.5px solid var(--ink);font-weight:700;
  font-size:14.5px;text-decoration:none;box-shadow:0 12px 30px rgba(0,0,0,.16);white-space:nowrap;
  transition:background .2s,color .2s}
.lcall:hover{background:var(--ink);color:var(--bg)}
.lcall svg{flex:none}
.lcall .m{display:none}
@media(max-width:699px){
  .lcall{padding:14px;box-shadow:none;font-size:15px}
  .lcall .m{display:inline}.lcall .d{display:none}
}

.lnum{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;
  border:1px solid var(--line);margin-bottom:10px;color:var(--ink);text-decoration:none}
.lnum:hover{border-color:var(--ink)}
.lnum b{display:block;font-size:15px}
.lnum i{display:block;font-style:normal;color:var(--soft);font-size:14px;margin-top:3px}
.lnum svg{color:var(--gold);flex:none;width:24px;height:24px}
.lalt{font-size:13px;text-align:center;margin:14px 0 0;color:var(--soft)}
.lalt a{color:var(--ink);font-weight:700}
.ltoast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;z-index:70;
  background:var(--ink);color:var(--bg);padding:12px 16px;font-size:13.5px;line-height:1.45;
  max-width:calc(100% - 32px);transition:all .25s;pointer-events:none;text-align:center}
.ltoast.on{opacity:1;transform:translate(-50%,0)}

    bgs[i].classList.remove('on');

function tileArea(s){
  const m=String(s).match(/(\d+)\s*[×x]\s*(\d+)/);
  if(!m)return null;
  let a=+m[1],b=+m[2];
  if(a<10){a*=1000;b*=1000;}            // "1×1 m"
  else if(a<100){a*=10;b*=10;}          // sm
  return (a/1000)*(b/1000);
}
function nf(x,d){return x.toFixed(d).replace('.',',');}
function calcHTML(d){
  const a=tileArea(d.olcham);
  if(!a)return '';
  const N=id=>'<div><label>'+id[1]+'</label><input id="'+id[0]+'" type="number" min="0" '+
    'step="0.1" inputmode="decimal" value="'+id[2]+'"></div>';
  return '<div class="calc"><h4>XONA HISOBLAGICHI</h4>'+
    '<div class="dims">'+N(['cU','Uzunlik, m','5'])+N(['cK','Kenglik, m','3'])+
      N(['cB','Balandlik, m','2.7'])+N(['cE','Eshik, dona','1'])+N(['cD','Deraza, dona','1'])+
    '</div>'+
    '<div class="opts">'+
      '<label><input type="checkbox" id="oP" checked> Pol</label>'+
      '<label><input type="checkbox" id="oW1" checked> Devor 1</label>'+
      '<label><input type="checkbox" id="oW2" checked> Devor 2</label>'+
      '<label><input type="checkbox" id="oW3" checked> Devor 3</label>'+
      '<label><input type="checkbox" id="oW4" checked> Devor 4</label>'+
    '</div>'+
    '<table id="ctab"></table>'+
    '<div class="note" id="cnote"></div>'+
    '<button class="add" id="cadd">Tanlanganlarga qo\'shish</button></div>';
}
function computeCalc(d){
  const a=tileArea(d.olcham);
  const v=id=>parseFloat((document.getElementById(id)||{}).value)||0;
  const ck=id=>(document.getElementById(id)||{}).checked;
  const U=v('cU'),K=v('cK'),B=v('cB'),E=v('cE'),Dr=v('cD');
  // zaxira: yirik plitada kesim ko'p, devorda burchak va o'yiqlar ko'p
  const big=a>=0.9;
  const rPol=big?0.10:0.07, rDev=big?0.13:0.10;
  const ochiq=E*1.8+Dr*2.1;                 // eshik 2,0×0,9 · deraza 1,5×1,4
  const rows=[];
  if(ck('oP')&&U&&K) rows.push(['Pol',U*K,rPol,U+'×'+K]);
  const walls=[['Devor 1',U],['Devor 2',K],['Devor 3',U],['Devor 4',K]];
  let wsum=0;
  walls.forEach((w,i)=>{ if(ck('oW'+(i+1))&&w[1]&&B){wsum+=w[1]*B;
    rows.push([w[0],w[1]*B,rDev,w[1]+'×'+B]);} });
  if(ochiq>0&&wsum>0){
    const cut=Math.min(ochiq,wsum*0.6);
    rows.push(['Eshik va deraza',-cut,rDev,'ayiriladi']);
  }
  let tm=0,tp=0;
  const tr=rows.map(r=>{
    const m=r[1], p=m>0?Math.ceil(m*(1+r[2])/a):Math.floor(m*(1+r[2])/a);
    tm+=m; tp+=p;
    return '<tr><td>'+r[0]+'<span style="color:var(--soft)"> · '+r[3]+'</span></td>'+
      '<td class="n" style="color:var(--soft)">'+nf(m,2)+' m²</td>'+
      '<td class="p">'+p+' dona</td></tr>';
  }).join('');
  return {html:tr, tm:tm, tp:tp, a:a, rPol:rPol, rDev:rDev, big:big};
}
function bindCalc(d){
  const box=document.getElementById('ctab');
  if(!box)return;
  const upd=()=>{
    const r=computeCalc(d);
    box.innerHTML=r.html+'<tr class="tot"><td>Jami</td><td class="n">'+nf(r.tm,2)+
      ' m²</td><td class="p">'+Math.max(0,r.tp)+' dona</td></tr>';
    document.getElementById('cnote').innerHTML=
      'Zaxira: pol '+Math.round(r.rPol*100)+'%, devor '+Math.round(r.rDev*100)+'% — '+
      (r.big?'yirik plita, kesim ko\'p chiqadi':'o\'rtacha o\'lcham')+'.<br>'+
      'Bitta plita '+nf(r.a,3)+' m². Eshik 2,0×0,9 m, deraza 1,5×1,4 m deb olindi.';
    CALC[d.id]=Math.max(0,r.tm);
  };
  ['cU','cK','cB','cE','cD'].forEach(i=>{const el=document.getElementById(i);
    if(el)el.oninput=upd;});
  ['oP','oW1','oW2','oW3','oW4'].forEach(i=>{const el=document.getElementById(i);
    if(el)el.onchange=upd;});
  const ad=document.getElementById('cadd');
  if(ad)ad.onclick=()=>{
    SEL.add(d.id); QTY[d.id]=String(Math.round((CALC[d.id]||0)*100)/100);
    saveSel(); paintSel(); render();
    ad.textContent='Qo\'shildi'; ad.classList.add('done');
    setTimeout(()=>{ad.textContent='Tanlanganlarga qo\'shish';ad.classList.remove('done');},1800);
  };
  upd();
}

    else if(document.referrer){try{s=new URL(document.referrer).hostname.replace(/^www\./,'');}catch(e){}}}
  let v={};try{v=JSON.parse(localStorage.getItem(MK)||'{}');}catch(e){}
  if(s){v={s:s,c:c};try{localStorage.setItem(MK,JSON.stringify(v));}catch(e){}}
  return v;
})();
if(AD){const ib=document.getElementById('inst');if(ib)ib.style.display='none';}

/* --- Meta Pixel --- */
if(C.pixel){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;
  n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
  s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',C.pixel);fbq('track','PageView');
}
const px=(ev,d)=>{try{if(window.fbq)fbq('track',ev,d||{});}catch(e){}};

/* --- qo'ng'iroq raqamlari --- */
const PHONE=C.phoneSvg||'';
const NUMS=(C.tel||[]).map(t=>{
  const d=String((t&&t.raqam)||t).replace(/\D/g,'');
  return {nom:(t&&t.nom)||'',d:d,href:'tel:+'+d,
    show:'+'+d.slice(0,3)+' '+d.slice(3,5)+' '+d.slice(5,8)+' '+d.slice(8,10)+' '+d.slice(10,12)};
}).filter(n=>n.d.length===12);
function toast(t){let el=document.getElementById('ltoast');
  if(!el){el=document.createElement('div');el.id='ltoast';el.className='ltoast';document.body.appendChild(el);}
  el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2800);}
function callTrack(n){
  px('Contact',{content_name:'Qo\'ng\'iroq'});
  if(C.endpoint&&navigator.sendBeacon){try{navigator.sendBeacon(C.endpoint,JSON.stringify({
    tur:'qongiroq',nom:n.nom,raqam:n.show,
    plita:(det.classList.contains('on')&&cur)?cur.kod:'',
    manba:SRC.s||"to'g'ridan-to'g'ri",kampaniya:SRC.c||''}));}catch(e){}}
}

/* --- tanlangan plitalar --- */
function items(){
  return D.filter(d=>SEL.has(d.id)).map(d=>{
    const a=tileArea(d.olcham), v=parseFloat(String(QTY[d.id]||'').replace(',','.'));
    return {id:d.id,kod:d.kod,olcham:d.olcham,sirt:d.sirt,m2:v>0?v:0,
            dona:(a&&v>0)?Math.ceil(v*1.05/a):0,menu:d.menu};
  });
}
function addCur(){
  if(typeof cur==='undefined'||!cur||SEL.has(cur.id))return;
  SEL.add(cur.id);saveSel();paintSel();
  const st=grid.querySelector('.card[data-id="'+cur.id+'"] .star');if(st)st.classList.add('on');
}

/* --- telefon --- */
function digits(v){let d=String(v).replace(/\D/g,'');if(d.length>9&&d.indexOf('998')===0)d=d.slice(3);return d.slice(0,9);}
function fmtTel(d){let o=d.slice(0,2);if(d.length>2)o+=' '+d.slice(2,5);
  if(d.length>5)o+=' '+d.slice(5,7);if(d.length>7)o+=' '+d.slice(7,9);return o;}
const telFull=t=>'+998 '+fmtTel(String(t).replace(/\D/g,'').slice(-9));

/* --- forma --- */
let XONA=new Set(), busy=false;
const L=document.getElementById('lead'), LW=document.getElementById('lw');
function me(){try{return JSON.parse(localStorage.getItem(LK)||'{}');}catch(e){return {};}}
function selHTML(){
  const it=items();
  if(!it.length)return '<div class="lsel"><div class="h">Tanlangan plitalar<a data-l="pick">Katalogdan tanlash</a></div>'+
    '<div class="e">Hali plita tanlanmagan. Bu shart emas — mutaxassisimiz tanlashga yordam beradi.</div></div>';
  return '<div class="lsel"><div class="h">Tanlangan plitalar · '+it.length+' ta<a data-l="edit">O\'zgartirish</a></div><ul>'+
    it.map(x=>'<li><img src="'+x.menu+'" alt=""><div><b>'+esc(x.kod)+'</b> <span>'+esc(x.olcham)+
      (x.m2?' · '+num(x.m2)+' m²':'')+'</span></div></li>').join('')+'</ul></div>';
}
function formHTML(){
  const m=me();
  return '<button class="lx" data-l="x" type="button" aria-label="Yopish">&times;</button>'+
  '<h3 class="serif" id="lh">Ariza qoldirish</h3>'+
  '<p class="ls">Mutaxassisimiz siz bilan bog\'lanib, narx, mavjudlik va yetkazib berish haqida ma\'lumot beradi.</p>'+
  selHTML()+
  '<form id="lform" novalidate>'+
  '<div class="lf" id="f_ism"><label for="l_ism">Ismingiz</label>'+
    '<input id="l_ism" autocomplete="name" value="'+esc(m.ism||'')+'"><div class="em">Ismingizni yozing</div></div>'+
  '<div class="lf" id="f_tel"><label for="l_tel">Telefon raqamingiz</label>'+
    '<div class="tel"><span>+998</span><input id="l_tel" type="tel" inputmode="numeric" autocomplete="tel-national" '+
    'placeholder="90 123 45 67" value="'+esc(m.tel?fmtTel(m.tel):'')+'"></div>'+
    '<div class="em">Raqamni to\'liq kiriting — 9 ta raqam</div></div>'+
  '<div class="lf" id="f_vil"><label for="l_vil">Viloyatingiz</label><select id="l_vil"><option value="">Tanlang…</option>'+
    (C.viloyatlar||[]).map(v=>'<option'+(m.viloyat===v?' selected':'')+'>'+esc(v)+'</option>').join('')+
    '</select><div class="em">Viloyatni tanlang</div></div>'+
  '<div class="lf"><label>Qaysi xona uchun? <i>— ixtiyoriy</i></label><div class="lch">'+
    (C.xonalar||[]).map(x=>'<button type="button" data-x="'+esc(x)+'"'+(XONA.has(x)?' class="on"':'')+'>'+esc(x)+'</button>').join('')+
    '</div></div>'+
  '<input class="lhp" id="l_hp" tabindex="-1" autocomplete="off" aria-hidden="true">'+
  '<button class="lgo" id="lgo" type="submit">Yuborish</button>'+
  '<div class="lerr" id="lerr"></div>'+
  '<p class="lcon">«Yuborish» tugmasini bosib, ko\'rsatilgan raqam orqali siz bilan bog\'lanishimizga rozilik bildirasiz.</p>'+
  '</form>'+
  (NUMS.length||!C.endpoint?'<p class="lalt">Shoshilinchmi? <a href="'+(NUMS.length===1?NUMS[0].href:'#')+
    '" data-c="1">Hoziroq qo\'ng\'iroq qiling'+(NUMS.length===1?' — '+NUMS[0].show:'')+'</a></p>':'');
}
function openCall(){
  LW.innerHTML='<button class="lx" data-l="x" type="button" aria-label="Yopish">&times;</button>'+
    '<h3 class="serif" id="lh">Qo\'ng\'iroq qilish</h3>'+
    '<p class="ls">Qulay raqamni tanlang — mutaxassisimiz javob beradi.</p>'+
    NUMS.map((n,i)=>'<a class="lnum" href="'+n.href+'" data-n="'+i+'"><span><b>'+
      esc(n.nom||'Qo\'ng\'iroq')+'</b><i>'+n.show+'</i></span>'+PHONE+'</a>').join('');
  LW.scrollTop=0;
  if(!L.classList.contains('on')){L.classList.add('on');requestAnimationFrame(()=>L.classList.add('vis'));}
  document.body.style.overflow='hidden';
}
function callClick(e){
  if(!NUMS.length){e.preventDefault();toast('Sinov rejimi: bu tugmaga kompaniya raqami qo\'yiladi');return;}
  if(NUMS.length>1){e.preventDefault();openCall();return;}
  callTrack(NUMS[0]);
}
function openLead(){
  LW.innerHTML=formHTML();LW.scrollTop=0;
  L.classList.add('on');requestAnimationFrame(()=>L.classList.add('vis'));
  document.body.style.overflow='hidden';
  try{if(window.fbq)fbq('trackCustom','ArizaFormasi');}catch(e){}
}
function closeLead(){
  L.classList.remove('vis');
  setTimeout(()=>{L.classList.remove('on');
    if(!det.classList.contains('on'))document.body.style.overflow='';},300);
}
window.openLead=openLead;

L.addEventListener('click',e=>{
  if(e.target===L){closeLead();return;}
  const nn=e.target.closest('[data-n]');
  if(nn){callTrack(NUMS[+nn.dataset.n]);return;}
  const cc=e.target.closest('[data-c]');
  if(cc){callClick(e);return;}
  const a=e.target.closest('[data-l]');
  if(a){const k=a.dataset.l;
    if(k==='x'||k==='back')closeLead();
    else if(k==='edit'){closeLead();setTimeout(()=>document.getElementById('fab').click(),320);}
    else if(k==='pick'){closeLead();if(det.classList.contains('on')&&typeof close_==='function')close_();}
    return;}
  const x=e.target.closest('[data-x]');
  if(x){const v=x.dataset.x;XONA.has(v)?XONA.delete(v):XONA.add(v);x.classList.toggle('on');}
});
L.addEventListener('input',e=>{
  if(e.target.id==='l_tel')e.target.value=fmtTel(digits(e.target.value));
  const f=e.target.closest('.lf');if(f)f.classList.remove('err');
});
L.addEventListener('change',e=>{const f=e.target.closest('.lf');if(f)f.classList.remove('err');});
L.addEventListener('submit',e=>{e.preventDefault();send();});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&L.classList.contains('on')){e.stopImmediatePropagation();closeLead();}
},true);

function preview(P){
  const R=['🆕 Yangi ariza — katalog','👤 '+P.ism,'📞 '+telFull(P.tel),'📍 '+P.viloyat];
  if(P.xona.length)R.push('🏠 '+P.xona.join(', '));
  if(P.mahsulotlar.length){R.push('🧱 Tanlagan plitalari:');
    P.mahsulotlar.forEach(x=>R.push('   • '+x.kod+' ('+x.olcham+', '+x.sirt+')'+
      (x.m2?' — '+num(x.m2)+' m²'+(x.dona?' ('+x.dona+' dona)':''):'')));}
  else R.push('🧱 Plita tanlanmagan');
  R.push('📣 Manba: '+P.manba+(P.kampaniya?' / '+P.kampaniya:''));
  const t=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tashkent',day:'2-digit',month:'2-digit',
    year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date()).replace(/\//g,'.');
  R.push('🕐 '+t);
  return R.join('\n');
}
function done(P,test){
  if(!test)px('Lead',{content_name:'Katalog arizasi',num_items:P.mahsulotlar.length});
  LW.innerHTML='<button class="lx" data-l="x" type="button" aria-label="Yopish">&times;</button>'+
    '<div class="lok"><div class="ic">&#10003;</div><h3 class="serif">Rahmat, '+esc(P.ism)+'!</h3>'+
    '<p>Arizangiz qabul qilindi. Mutaxassisimiz tez orada <b>'+telFull(P.tel)+'</b> raqamiga qo\'ng\'iroq qiladi.</p>'+
    '<button class="lback" data-l="back" type="button">Katalogga qaytish</button>'+
    (test?'<div class="ltest"><b>SINOV REJIMI</b>Ariza hali hech qayerga yuborilmadi. '+
      'Ulangandan keyin Telegram guruhingizga shunday xabar tushadi:<pre>'+esc(preview(P))+'</pre></div>':'')+
    '</div>';
  LW.scrollTop=0;
}
async function send(){
  if(busy)return;
  const ism=$('#l_ism').value.trim(), tel=digits($('#l_tel').value), vil=$('#l_vil').value;
  let ok=true;
  const bad=(id,b)=>{document.getElementById(id).classList.toggle('err',b);if(b)ok=false;};
  bad('f_ism',ism.length<2);bad('f_tel',tel.length!==9);bad('f_vil',!vil);
  if(!ok){const f=L.querySelector('.lf.err input,.lf.err select');if(f)f.focus();return;}
  const P={ism:ism,tel:'+998'+tel,viloyat:vil,xona:[...XONA],
    mahsulotlar:items().map(x=>({kod:x.kod,olcham:x.olcham,sirt:x.sirt,m2:x.m2,dona:x.dona})),
    manba:SRC.s||"to'g'ridan-to'g'ri",kampaniya:SRC.c||'',
    sahifa:location.href.split('#')[0],website:$('#l_hp').value};
  try{localStorage.setItem(LK,JSON.stringify({ism:ism,tel:tel,viloyat:vil}));}catch(e){}
  if(!C.endpoint){done(P,true);return;}
  const btn=$('#lgo'),er=$('#lerr');er.style.display='none';
  busy=true;btn.disabled=true;btn.textContent='Yuborilmoqda…';
  try{
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);
    const r=await fetch(C.endpoint,{method:'POST',body:JSON.stringify(P),signal:ac.signal});
    clearTimeout(tm);
    let j={};try{j=await r.json();}catch(e){}
    if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));
    done(P,false);
  }catch(err){
    er.textContent='Ariza yuborilmadi. Internetni tekshirib, qayta urinib ko\'ring.';
    er.style.display='block';btn.disabled=false;btn.textContent='Qayta yuborish';
  }finally{busy=false;}
}

/* --- tugmalar --- */
document.getElementById('lbtn').onclick=()=>{if(det.classList.contains('on'))addCur();openLead();};
const CB=document.getElementById('lcall');
if(!NUMS.length&&C.endpoint){CB.style.display='none';}
else{
  if(NUMS.length===1){CB.href=NUMS[0].href;CB.querySelector('.d').textContent=NUMS[0].show;}
  CB.addEventListener('click',callClick);
}
const prow=document.querySelector('#panel .prow');
if(prow){const b=document.createElement('button');b.type='button';b.className='lpq';
  b.textContent='Shu plitalarga ariza qoldirish';
  b.onclick=()=>{closePanel();openLead();};prow.before(b);}
const _open=open_;
open_=function(id,nh){
  _open(id,nh);
  try{if(window.fbq)fbq('track','ViewContent',{content_ids:[cur.kod],content_type:'product'});}catch(e){}
  const dl=document.querySelector('#dwrap .dmain dl');if(!dl)return;
  const b=document.createElement('button');b.type='button';b.className='lq';
  b.innerHTML='Shu plitaga ariza qoldirish <span class="ar">&rarr;</span>';
  b.onclick=()=>{addCur();openLead();};
  dl.after(b);
};
})();
</script>
</body></html>
